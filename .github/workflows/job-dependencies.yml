name: first assignment
on: push
jobs:
  first_job:
     runs-on: ubuntu-latest
     steps: 
      - name: print hello world using bash
        run: echo "Running Job A"
        shell: bash
  second_job:
     runs-on: ubuntu-latest
     steps: 
      - name: print hello world using bash
        run: echo "Running Job B"
        shell: bash  
  third_job:
     needs: first_job
     runs-on: ubuntu-latest
     steps: 
      - name: print hello world using bash
        run: echo "Running Job C after job A"
        shell: bash  
   fourth_job:
     needs: third_job
     runs-on: ubuntu-latest
     steps: 
      - name: print hello world using bash
        run: echo "Running Job D after job C"
        shell: bash  
            
       
